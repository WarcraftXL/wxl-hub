# Builds wxl-hub.exe and its payload, and publishes a release for every commit that lands on main.
#
# The job is deliberately the same commands a developer runs: fetch the pinned dependencies,
# compile-check the sources, build. Nothing here knows anything build.ps1 does not, so a green run
# means the documented local build works, not that some parallel CI path does.
#
# Versioning is automatic and nothing has to be tagged by hand. The series below is the only number
# anyone edits, and only when a release is worth calling a new one.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Major and minor. The patch is the commit count, so every commit on main is a version and this
  # line is the whole of the ceremony: bump it when a release deserves to be called something new.
  SERIES: '1.0'

  # Which clock decides what "today" means for the R number. The runner is on UTC, and a commit
  # pushed late in the evening in Paris would otherwise be counted as the next day's first build.
  TIMEZONE: 'Romance Standard Time'

defaults:
  run:
    # Stated rather than left to the default, because the two PowerShells disagree about native
    # programs. Windows PowerShell 5.1 turns a line written to stderr into an error record and can
    # end a script that succeeded; pwsh does not. The scripts are written to survive both, and this
    # pins which one is being asked to run them.
    shell: pwsh

jobs:
  build:
    # webview is compiled from source and the output is a Windows PE, so there is no cross-building
    # this on anything else.
    runs-on: windows-latest

    outputs:
      version: ${{ steps.v.outputs.version }}
      name:    ${{ steps.v.outputs.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The patch number is the commit count, which a shallow clone cannot produce.
          fetch-depth: 0

      # deps\ holds four pinned binaries and none of them are committed. Caching them keeps the
      # webview compile, which is the only slow step, off every run that did not change the pins.
      - name: Cache vendored binaries
        uses: actions/cache@v4
        with:
          path: deps/luvi/luvi-Windows-amd64-luajit-regular.exe
          key: deps-${{ hashFiles('scripts/Get-Deps.ps1') }}
        # Listed one path per entry below rather than as a glob, so a partially populated deps\ can
        # never restore as a hit.

      - name: Cache built webview
        uses: actions/cache@v4
        with:
          path: |
            deps/webview/webview.dll
            deps/webview/WebView2Loader.dll
            deps/sqlite/sqlite3.dll
          key: deps-native-${{ hashFiles('scripts/Get-Deps.ps1') }}

      - name: Fetch dependencies
        run: .\scripts\Get-Deps.ps1

      - name: Compile check
        run: |
          .\deps\luvi\luvi-Windows-amd64-luajit-regular.exe scripts\check
          if ($LASTEXITCODE -ne 0) { throw "sources do not compile" }

      # Two identities, and they are not interchangeable.
      #
      # The **version** is what an installed hub compares against a published release, and the
      # comparison is semver: three numbers, and anything else compares equal to everything, which
      # would mean no update is ever detected and nothing anywhere saying why. So the version is
      # series.commit-count, which only ever goes up and needs nobody to remember anything.
      #
      # The **name** is for people. It carries the day's build number and the time, which is what
      # actually tells two builds of the same afternoon apart at a glance.
      - name: Work out the version
        id: v
        run: |
          $tz    = [TimeZoneInfo]::FindSystemTimeZoneById($env:TIMEZONE)
          $local = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz)
          $since = [TimeZoneInfo]::ConvertTimeToUtc($local.Date, $tz).ToString('o')

          $count = [int](git rev-list --count HEAD)
          # Clamped, because a commit authored just before local midnight can leave the day's count
          # at zero, and R000 is not a build number anyone would recognise.
          $today = [Math]::Max(1, [int](git rev-list --count --since="$since" HEAD))

          $release = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'
          $version = if ($release) { "$env:SERIES.$count" } else { 'dev-' + $env:GITHUB_SHA.Substring(0, 7) }
          $name    = "WarcraftXL Hub R{0:d3} - {1:yyyy-MM-dd HH:mm}" -f $today, $local

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$name"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "$version   $name"

      - name: Build
        run: .\build.ps1 -Compile -Release ${{ steps.v.outputs.version }}

      # Both, always. The payload is useless without an executable old enough to have shipped once,
      # and an executable published without its payload leaves everyone already running the hub with
      # no way to move.
      - uses: actions/upload-artifact@v4
        with:
          name: wxl-hub-${{ steps.v.outputs.version }}
          path: |
            build/wxl-hub.exe
            build/wxl-hub-payload.zip
          if-no-files-found: error

  # Every commit on main becomes a release, tag included. The tag is created by this job from the
  # version above rather than pushed by hand, and a tag created with GITHUB_TOKEN does not start
  # another run, so there is no loop to break.
  #
  # Published outright, not drafted. A draft is invisible to the hub, which reads the newest
  # published release and skips drafts and prereleases both, so drafting every build would mean
  # building updates nobody is ever offered. Flip `prerelease` to true below if you would rather
  # each build be held back until you promote it: everything stays automatic and shipping becomes
  # one switch on the release page.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A job's permissions replace the workflow's rather than adding to them, so `contents: write`
    # alone would take away the read access the download step needs. Both are named here.
    #
    # This is the whole of the credential story: GITHUB_TOKEN is minted for each run and expires
    # with it, so nothing has to be created, stored or rotated. What decides whether publishing
    # works is this block, not which kind of token was used. Private repositories publish releases
    # exactly like public ones; they are simply only visible to people with access.
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wxl-hub-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.name }}
          # The payload asset name is a contract: core/boot.lua looks for wxl-hub-payload*.zip on the
          # newest published release and offers nothing if it is not there.
          files: |
            wxl-hub.exe
            wxl-hub-payload.zip
          generate_release_notes: true
          prerelease: false
